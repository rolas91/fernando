name: WorkOps monorepo CI and containers
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_USER: isolated_test
      DB_PASSWORD: isolated_test_only
      DB_NAME: isolated_test
      DB_SYNCHRONIZE: "false"
      AUTH_DEV_BYPASS: "false"
      JWT_SECRET: ci-only-not-for-production-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run install:projects
      - run: npm run check:workspace
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Set immutable image identity
        id: identity
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - name: Build container for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          file: backend/Dockerfile.production
          load: true
          tags: dr-workops-ci:local
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |-
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Container smoke test
        run: docker compose -f backend/deploy/compose.smoke.yml up -d --wait --wait-timeout 240
      - name: Verify updated runtime libraries inside API image
        run: docker compose -f backend/deploy/compose.smoke.yml exec -T api node < backend/scripts/security-runtime-smoke.cjs
      - name: Stop isolated smoke stack
        if: always()
        run: docker compose -f backend/deploy/compose.smoke.yml down --volumes --remove-orphans
      - name: Login to GHCR
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          file: backend/Dockerfile.production
          push: true
          platforms: ${{ github.ref == 'refs/heads/master' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |-
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image digest
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: 'echo "Image: $IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"'
        env:
          IMAGE_NAME: ${{ steps.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
  web:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Set immutable image identity
        id: identity
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - name: Build container for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./frontend
          file: frontend/Dockerfile
          load: true
          tags: dr-workops-ci:local
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |-
            VITE_API_URL=
            VITE_REALTIME_URL=
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_BUSINESS_TIME_ZONE=${{ vars.VITE_BUSINESS_TIME_ZONE || 'America/Los_Angeles' }}
          labels: |-
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Container smoke test
        run: docker run --rm dr-workops-ci:local nginx -t
      - name: Login to GHCR
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          platforms: ${{ github.ref == 'refs/heads/master' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |-
            VITE_API_URL=
            VITE_REALTIME_URL=
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_BUSINESS_TIME_ZONE=${{ vars.VITE_BUSINESS_TIME_ZONE || 'America/Los_Angeles' }}
          labels: |-
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image digest
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: 'echo "Image: $IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"'
        env:
          IMAGE_NAME: ${{ steps.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
  release:
    needs:
      - api
      - web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record immutable release
        run: node scripts/deployment/release.cjs create
        env:
          API_IMAGE: ${{ needs.api.outputs.image }}
          WEB_IMAGE: ${{ needs.web.outputs.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
          if-no-files-found: error
  deploy_dev:
    needs:
      - api
      - web
      - release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.ENABLE_DEV_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: dev
      url: https://dev.drworkops.com
    concurrency:
      group: deployment-dev
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: dev
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select release from this build
        run: node scripts/deployment/release.cjs create
        env:
          API_IMAGE: ${{ needs.api.outputs.image }}
          WEB_IMAGE: ${{ needs.web.outputs.image }}
      - name: Deploy dev and verify health
        run: node scripts/deployment/release.cjs deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-validated-${{ github.run_attempt }}
          path: dev-validated.json
          retention-days: 90
          if-no-files-found: error
      - name: Promotion instructions
        run: 'echo "Promote this tested release from Actions → Promover a producción. Build run: $GITHUB_RUN_ID" >>
          "$GITHUB_STEP_SUMMARY"'
