name: EAS native build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: EAS profile
        type: choice
        options:
          - preview
          - production
        default: preview
permissions:
  contents: read
concurrency:
  group: mobile-eas-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      PLATFORM: ${{ inputs.platform }}
      PROFILE: ${{ inputs.profile }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Build without publishing to app stores
        shell: bash
        run: >-
          set -Eeuo pipefail

          : "${EXPO_TOKEN:?Configure EXPO_TOKEN}"

          : "${EAS_PROJECT_ID:?Configure EAS_PROJECT_ID}"

          [[ "$PLATFORM" == android || "$PLATFORM" == ios || "$PLATFORM" == all
          ]] || exit 2

          [[ "$PROFILE" == preview || "$PROFILE" == production ]] || exit 2

          npx --yes eas-cli@27.5.0 build --platform "$PLATFORM" --profile
          "$PROFILE" --non-interactive --wait
    defaults:
      run:
        working-directory: mobile
